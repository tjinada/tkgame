<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <!-- Background -->
  <rect width="400" height="400" fill="#12121a"/>
  
  <!-- Decorative frame -->
  <rect x="10" y="10" width="380" height="380" rx="12" stroke="#ec4899" stroke-width="2" fill="none" opacity="0.3"/>
  <rect x="20" y="20" width="360" height="360" rx="8" stroke="#ec4899" stroke-width="1" fill="none" opacity="0.2"/>
  
  <!-- Corner decorations -->
  <path d="M30 50 L30 30 L50 30" stroke="#ec4899" stroke-width="2" fill="none" opacity="0.5"/>
  <path d="M370 50 L370 30 L350 30" stroke="#ec4899" stroke-width="2" fill="none" opacity="0.5"/>
  <path d="M30 350 L30 370 L50 370" stroke="#ec4899" stroke-width="2" fill="none" opacity="0.5"/>
  <path d="M370 350 L370 370 L350 370" stroke="#ec4899" stroke-width="2" fill="none" opacity="0.5"/>
  
  <!-- Focus/zoom icon -->
  <rect x="130" y="130" width="140" height="140" rx="8" stroke="#22222e" stroke-width="4" fill="#1a1a24"/>
  <circle cx="200" cy="200" r="45" stroke="#ec4899" stroke-width="2" fill="none" opacity="0.3"/>
  
  <!-- Crosshair -->
  <line x1="200" y1="140" x2="200" y2="170" stroke="#ec4899" stroke-width="2" opacity="0.4"/>
  <line x1="200" y1="230" x2="200" y2="260" stroke="#ec4899" stroke-width="2" opacity="0.4"/>
  <line x1="140" y1="200" x2="170" y2="200" stroke="#ec4899" stroke-width="2" opacity="0.4"/>
  <line x1="230" y1="200" x2="260" y2="200" stroke="#ec4899" stroke-width="2" opacity="0.4"/>
  
  <!-- Upload icon -->
  <circle cx="200" cy="200" r="25" stroke="#ec4899" stroke-width="2" fill="none" opacity="0.5"/>
  <path d="M190 200 L200 190 L210 200 M200 190 L200 210" stroke="#ec4899" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/>
  
  <!-- Text -->
  <text x="200" y="320" text-anchor="middle" fill="#64748b" font-family="system-ui, sans-serif" font-size="14" font-weight="500">
    Upload Body Part
  </text>
  <text x="200" y="342" text-anchor="middle" fill="#475569" font-family="system-ui, sans-serif" font-size="11">
    Click or drag image here
  </text>
</svg>
